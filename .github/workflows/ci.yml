name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server and MCP (lint, tests, persona-200, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the tag each SHA was taken from is
      # noted alongside. Bump by updating both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt ruff==0.17.6 pip-audit
      - name: Lint
        run: ruff check .
      - name: Server tests
        working-directory: server
        run: python -m pytest tests -q
      - name: MCP server tests
        working-directory: mcp-server
        run: python -m pytest test_secretbox_mcp.py -q
      - name: persona-200 regression
        # Parser and search quality gate. Fails when a headline metric drops
        # below its floor in testsets/persona200/floors.json.
        run: python server/scripts/run_persona_suite.py --out-dir "$RUNNER_TEMP/persona" --db "$RUNNER_TEMP/persona/run.db"
      - name: Dependency audit
        # Advisory on purpose: a newly published advisory must be visible
        # without blocking unrelated work. Dependabot opens the fix.
        continue-on-error: true
        run: pip-audit --progress-spinner off -r server/requirements.txt

  macos:
    name: macOS app unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build for testing
        working-directory: SecretBox
        run: |
          xcodebuild -project SecretBox.xcodeproj -scheme SecretBox \
            -destination "platform=macOS" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build-for-testing
      - name: Unit tests
        working-directory: SecretBox
        # The model suite (which includes the 50-sample classifier regression)
        # and the TOTP engine. View snapshots are not run here: their pixel
        # baselines were recorded on a developer machine and do not transfer
        # to hosted runners.
        run: |
          xcodebuild -project SecretBox.xcodeproj -scheme SecretBox \
            -destination "platform=macOS" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" test-without-building \
            -only-testing:SecretBoxTests/SecretBoxAppModelTests \
            -only-testing:SecretBoxTests/TOTPEngineTests
