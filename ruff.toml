# Lint for the Python side of the repo: the FastAPI server, the MCP server,
# the dev scripts and the scenario tooling. Run with `ruff check .`
# (CI does; scripts/test.sh does when ruff is available).
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
  # FastAPI's dependency injection puts `Depends(...)` in default arguments.
  "B008",
]

[lint.per-file-ignores]
# Dev scripts put the server package on sys.path before importing from it.
"server/scripts/*.py" = ["E402"]
