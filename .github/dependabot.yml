version: 2
# Weekly dependency pull requests. The server's pins are audited on every CI
# run as well (pip-audit, advisory); these are what proposes the fixes.
updates:
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
